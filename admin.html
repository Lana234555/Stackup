<!doctype html>
<html lang="uk" class="guard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="theme-color" content="#0f100e">
<link rel="icon" href="assets/icons/crm.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/crm-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/crm-192.png?v=2">
<link rel="apple-touch-icon" href="assets/icons/crm-180.png?v=2">
<link rel="manifest" href="crm.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stackup">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Stackup — керування</title>
<link rel="stylesheet" href="brief.css?v=4">
<link rel="stylesheet" href="admin.css?v=14">
<link rel="stylesheet" href="hub.css?v=4">
<link rel="stylesheet" href="chat.css?v=1">
</head>
<body class="adm">

<section class="login" id="login" hidden>
  <div>
    <a class="brand" href="admin.html">STACKUP<i class="dot"></i></a>
    <p class="eyebrow"><i></i> STACKUP / КЕРУВАННЯ</p>
    <h1 class="h2">Заявки, контент, матеріали.<br><span class="serif">В одному місці.</span></h1>
    <p class="lead" id="loginLead">Введіть код кабінету. Після нього на вашу пошту прийде одноразовий код підтвердження.</p>
    <form id="loginForm" class="login-form">
      <input type="text" name="username" autocomplete="username" value="Stackup CRM" hidden>
      <label class="field"><span class="f-label">Код кабінету</span><input type="password" id="codeInput" name="code" autocomplete="current-password" inputmode="text" maxlength="64" placeholder="••••••" required></label>
      <button class="button primary" type="submit" id="codeBtn"><b>Далі</b> <span>↗︎</span></button>
      <p class="step-error" id="loginError" role="alert"></p>
    </form>
    <form id="otpForm" class="login-form" autocomplete="off" hidden>
      <label class="check mono trust"><input type="checkbox" id="trustInput" checked> ДОВІРЯТИ ЦЬОМУ ПРИСТРОЮ 30 ДНІВ</label>
      <label class="field"><span class="f-label">Код із листа <em class="mono" id="otpTo"></em></span><input type="text" id="otpInput" name="otp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label>
      <button class="button primary" type="submit" id="otpBtn"><b>Увійти</b> <span>↗︎</span></button>
      <button class="link mono back-step" type="button" id="otpBack">← ВВЕСТИ КОД ЗНОВУ</button>
      <p class="step-error" id="otpError" role="alert"></p>
    </form>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <a class="brand" href="admin.html">STACKUP<i class="dot"></i></a>
    <span class="side-tag mono">СИСТЕМА КЕРУВАННЯ</span>
    <nav class="side-nav" id="sideNav">
      <button type="button" data-sec="home"><span class="ico">◇</span>Огляд</button>
      <div class="side-sec" data-group="leads">
        <button type="button" class="side-group mono" aria-expanded="true">ЗАЯВКИ <em class="hot" id="grpLeads"></em><i aria-hidden="true">⌄</i></button>
        <div class="side-items">
          <button type="button" data-sec="leads"><span class="ico">▦</span>Заявки <em class="hot" id="cntNew"></em><em id="cntAll"></em></button>
          <button type="button" data-sec="chats"><span class="ico">✺</span>Чати <em class="hot" id="cntChats"></em></button>
          <button type="button" data-sec="mail"><span class="ico">✉</span>Розсилки</button>
        </div>
      </div>
      <div class="side-sec" data-group="content">
        <button type="button" class="side-group mono" aria-expanded="true">INSTAGRAM <em class="hot" id="grpContent"></em><i aria-hidden="true">⌄</i></button>
        <div class="side-items">
          <button type="button" data-sec="content" data-ctab="review"><span class="ico">✦</span>Контент <em class="hot" id="cntReview"></em></button>
          <button type="button" data-sec="content" data-ctab="plan"><span class="ico">▤</span>Календар</button>
          <button type="button" data-sec="content" data-ctab="grid"><span class="ico">⊞</span>Сітка профілю</button>
        </div>
      </div>
      <div class="side-sec" data-group="work">
        <button type="button" class="side-group mono" aria-expanded="true">РОБОТА І РОЗВИТОК <em class="hot" id="grpWork"></em><i aria-hidden="true">⌄</i></button>
        <div class="side-items">
          <button type="button" data-sec="tasks"><span class="ico">☐</span>Задачі <em class="hot" id="cntTasks"></em></button>
          <button type="button" data-sec="strategy"><span class="ico">◎</span>Стратегія</button>
        </div>
      </div>
      <div class="side-sec" data-group="company">
        <button type="button" class="side-group mono" aria-expanded="true">КОМПАНІЯ<i aria-hidden="true">⌄</i></button>
        <div class="side-items">
          <button type="button" data-sec="library"><span class="ico">❒</span>Матеріали</button>
          <button type="button" data-sec="settings"><span class="ico">⚙</span>Налаштування</button>
          <button type="button" class="copy-nav" data-copylink="/brief.html?mode=has"><span class="ico">⧉</span>Бриф: є ТЗ</button>
          <button type="button" class="copy-nav" data-copylink="/brief.html?mode=none"><span class="ico">⧉</span>Бриф: створити ТЗ</button>
        </div>
      </div>
    </nav>
    <div class="side-foot">
      <span class="demo-tag mono" id="demoTag" hidden>ДЕМО-ДАНІ</span>
      <button type="button" class="link mono" id="bellBtn">🔔 СПОВІЩЕННЯ</button>
      <button type="button" class="link mono" id="logoutBtn">ВИЙТИ</button>
      <button type="button" class="link mono" id="logoutAllBtn">ВИЙТИ НА ВСІХ ПРИСТРОЯХ</button>
    </div>
  </aside>

  <div class="main">
    <section class="sec" id="secLeads" data-section="leads" hidden>
    <header class="top">
      <div class="top-title">
        <h1 id="viewTitle">Заявки</h1>
        <span class="mono" id="updated"></span>
      </div>
      <div class="top-tools">
        <input type="search" id="search" placeholder="Пошук клієнта, email, нотаток" aria-label="Пошук">
        <button type="button" class="new-badge mono" id="newBadge" hidden></button>
        <button type="button" class="icon-btn" id="refreshBtn" aria-label="Оновити">↻</button>
        <div class="seg mono" role="group" aria-label="Вигляд"><button type="button" data-view="board">ВОРОНКА</button><button type="button" data-view="list" data-plain="1">СПИСОК</button><button type="button" data-quick="archive">АРХІВ <em id="cntArch"></em></button></div>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="filterbar">
      <select id="fMode" aria-label="Тип заявки"><option value="all">Усі заявки</option><option value="has">Готове ТЗ</option><option value="none">Бриф</option><option value="lead">Заявка з сайту</option><option value="chat">Telegram / Instagram</option></select>
      <select id="fType" aria-label="Вид проєкту"></select>
      <select id="fBudget" aria-label="Бюджет"></select>
      <select id="fPeriod" aria-label="Період"><option value="all">За весь час</option><option value="today">Сьогодні</option><option value="week">7 днів</option><option value="month">30 днів</option></select>
      <select id="fSort" aria-label="Сортування"><option value="new">Спершу нові</option><option value="old">Спершу старі</option><option value="deadline">За терміном</option></select>
      <label class="check mono"><input type="checkbox" id="fUnread"> НЕПЕРЕГЛЯНУТІ</label>
      <button type="button" class="link mono" id="resetBtn" hidden>× СКИНУТИ</button>
      <span class="result-count mono" id="resultCount"></span>
    </div>

    <section class="board" id="board" aria-label="Воронка"></section>

    <section class="listview" id="listview" hidden>
      <div class="filters" id="statusChips" role="tablist" aria-label="Статус"></div>
      <div class="table-wrap">
        <table class="table">
          <thead class="mono"><tr><th></th><th>НАДІЙШЛА</th><th>КЛІЄНТ</th><th>ЩО ПОТРІБНО</th><th>ТЕРМІНИ</th><th>БЮДЖЕТ</th><th>ФАЙЛИ</th><th>ЕТАП</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    </section>

    <section class="sec" id="secHome" data-section="home" hidden></section>
    <section class="sec" id="secChats" data-section="chats" hidden></section>
    <section class="sec" id="secContent" data-section="content" hidden></section>
    <section class="sec" id="secTasks" data-section="tasks" hidden></section>
    <section class="sec" id="secMail" data-section="mail" hidden></section>
    <section class="sec" id="secStrategy" data-section="strategy" hidden></section>
    <section class="sec" id="secLibrary" data-section="library" hidden></section>
    <section class="sec" id="secSettings" data-section="settings" hidden></section>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Розділи">
  <button type="button" data-sec="home"><span>◇</span>Огляд</button>
  <button type="button" data-sec="chats"><span>✺</span>Чати<em class="hot" id="tabChats"></em></button>
  <button type="button" data-sec="leads"><span>▦</span>Заявки<em class="hot" id="tabNew"></em></button>
  <button type="button" data-sec="content"><span>✦</span>Контент<em class="hot" id="tabReview"></em></button>
  <button type="button" data-sec="settings"><span>⚙</span>Ще</button>
</nav>
</div>



<div class="viewer" id="viewer" hidden></div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Заявка" hidden>
  <article class="detail" id="detail"></article>
</aside>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=4"></script>
<script src="admin.js?v=18" defer></script>
<script src="hub.js?v=4" defer></script>
<script src="chat.js?v=1" defer></script>
</body>
</html>
